<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rino Gelardi · IT Infrastructure Governance</title>
<meta name="description" content="Rino Gelardi, IT Infrastructure Governance. Turin, Italy, remote. Website under construction.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#F4F4F2">
<!--
  Temporary landing page: the email signature (FIRMA_info_EN.html layout) scaled up,
  plus one line saying the site is under construction. English only (owner, 2026-11-26).
  Identity: direction A "Svizzera, sobria" (BRAND_Immagine_Coordinata.md).
  Light blue #6E9BD1 only inside the monogram; Blu Torino #1D3A5F only on the role line.
  No external requests: Inter only if installed, otherwise Helvetica/Arial (no Google Fonts:
  it would send visitors' IPs to Google, GDPR issue).
  Everything is sized from --u, so the whole signature scales as one block.
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Rino Gelardi",
  "jobTitle": "IT Infrastructure Governance",
  "url": "https://rinogelardi.com/",
  "email": "mailto:info@rinogelardi.com",
  "telephone": "+39 340 388 9830",
  "address": { "@type": "PostalAddress", "addressLocality": "Turin", "addressCountry": "IT" }
}
</script>
<style>
  :root {
    --ink: #111418;
    --text: #2A2E33;
    --blu: #1D3A5F;
    --azzurro: #6E9BD1;
    --pietra: #5F6368;
    --rule: #C4C7CB;
    --carta: #F4F4F2;
    --font: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
    /* 1u = 1px of the email signature. Up to 2.2x on desktop, shrinks on phones. */
    /* 375px wide: about 1.15; from about 900px wide: 2.2 (monogram 105px). */
    --u: clamp(1px, 0.2vw + 0.4px, 2.2px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--carta);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .sig { display: flex; align-items: flex-start; }

  .mark {
    flex: none;
    width: calc(48 * var(--u)); height: calc(48 * var(--u));
    background: var(--ink);
    position: relative;
  }
  .mark::before {
    content: ""; position: absolute;
    left: calc(6 * var(--u)); top: calc(6 * var(--u));
    width: calc(12 * var(--u)); height: calc(2 * var(--u));
    background: var(--azzurro);
  }
  .mark span {
    position: absolute; left: calc(6 * var(--u)); bottom: calc(5 * var(--u));
    font-weight: 700; font-size: calc(19 * var(--u)); letter-spacing: calc(-1 * var(--u)); line-height: 1;
    color: #FFFFFF;
  }

  .text {
    margin-left: calc(16 * var(--u));
    padding-left: calc(16 * var(--u));
    border-left: 1px solid var(--rule);
    font-size: calc(13 * var(--u));
    line-height: calc(18 * var(--u));
    color: var(--text);
  }
  h1 {
    margin: 0;
    font-size: calc(16 * var(--u));
    line-height: calc(20 * var(--u));
    font-weight: 700;
    color: var(--ink);
  }
  .role { margin: 0; font-weight: 600; color: var(--blu); }
  .contacts { margin: calc(8 * var(--u)) 0 0; }
  .contacts a { color: var(--text); text-decoration: none; }
  .contacts a:hover, .contacts a:focus-visible { text-decoration: underline; outline: none; }
  .where { margin: 0; color: var(--pietra); }

  .wip {
    margin: calc(40 * var(--u)) 0 0;
    font-size: calc(9 * var(--u) + 4px);
    color: var(--pietra);
    text-align: center;
  }

  /* Narrow screens: email and phone on two lines, otherwise the block is wider than the phone. */
  @media (max-width: 600px) {
    .contacts .dot { display: none; }
    .contacts a { display: block; }
  }
</style>
</head>
<body>
  <div class="sig">
    <div class="mark" aria-hidden="true"><span>RG</span></div>
    <div class="text">
      <h1>Rino Gelardi</h1>
      <p class="role">IT Infrastructure Governance</p>
      <p class="contacts"><a href="mailto:info@rinogelardi.com">info@rinogelardi.com</a><span class="dot"> · </span><a href="tel:+393403889830">+39 340 388 9830</a></p>
      <p class="where">Turin, Italy · Remote</p>
    </div>
  </div>
  <p class="wip">Website under construction. See you in 2027.</p>
</body>
</html>
